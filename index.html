<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>掲示板</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-strong: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #26a79a;
      --primary-strong: #1f877b;
      --chip: #e8fffc;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    body.theme-dark {
      --bg: #111827;
      --surface: rgba(17, 24, 39, 0.85);
      --surface-strong: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --primary: #2dd4bf;
      --primary-strong: #14b8a6;
      --chip: #0f2a2a;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    /* ページ全体のフォント・余白設定 & 背景設定 */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: var(--text);
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
    }
    #posts {
      list-style-type: none;
      padding: 0;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      padding: 16px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .meta-grid .pill {
      justify-content: center;
      color: var(--text);
    }
    .sidebar-section h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover {
      border-color: var(--primary);
    }
    .post {
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      position: relative;
    }
    .post-title {
      font-weight: bold;
      font-size: 1.5em;
    }
    .post-content {
      margin-top: 5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .post-date {
      font-size: 0.9em;
      color: #888;
    }
    .post-number {
      font-size: 0.9em;
      color: #888;
      position: absolute;
      bottom: 0;
      right: 0;
    }
    /* 返信ボタンのスタイル */
    .reply-button {
      background: none;
      border: none;
      font-size: 0.9em;
      color: #888; /* 投稿ナンバーと同じ色 */
      text-decoration: underline; /* 下線 */
      cursor: pointer;
      padding: 0;
      /* 位置調整: 投稿の左下に配置 */
      position: absolute;
      bottom: 0;
      left: 0; /* rightから変更 */
    }
    .reply-button:hover {
      color: #555;
    }
    .report-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: #ddd;
      color: #555;
      border: none;
      font-size: 0.8em;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .report-button:hover {
      background-color: #ccc;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      font-size: 16px;
      border: 2px solid #000;
    }
    textarea {
      height: 300px;
      resize: none;
    }
    button {
      background-color: var(--primary);
      color: white;
      padding: 15px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 18px;
    }
    button:hover {
      background-color: var(--primary-strong);
    }
    .theme-toggle {
      font-size: 14px;
      padding: 8px 12px;
    }
    /* 設定ボタンのスタイル：背景色を半透明の明るいグレーに変更 */
    .settings-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: rgba(211,211,211,0.6);
      border: none;
      width: 75px;
      height: 75px;
      cursor: pointer;
      z-index: 1000;
    }
    .settings-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    /* モーダルウィンドウのスタイル */
    .modal {
      display: none;
      position: fixed;
      z-index: 1001;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 600px;
      border-radius: 10px;
    }
    .close-modal {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal:hover,
    .close-modal:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    /* 背景候補画像および「なし」「端末から挿入」オプションのスタイル */
    .bg-option {
      width: 30%;
      margin: 1%;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 5px;
    }
    .bg-option:hover {
      border-color: #26a79a;
    }
    /* 「なし」オプション用のスタイル */
    .none-option {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-size: 16px;
      color: #333;
      height: 100px;
    }
    /* 投稿ナンバーのリンクスタイル */
    .post-number-link {
      cursor: pointer;
      text-decoration: underline;
      color: #26a79a; /* 指定された色に変更 */
    }
    .post-number-link:hover {
      color: #1f877b; /* ホバー時の色も調整 */
    }
    /* 管理者アイコンのスタイル */
    .admin-icon {
      vertical-align: middle; /* テキストと画像を中央揃えにする */
      margin-left: 5px; /* ユーザー名との間に少しスペースを空ける */
      width: 20px; /* アイコンの幅 */
      height: 20px; /* アイコンの高さ */
    }
    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: 2fr 1fr;
      }
      .main-column {
        display: grid;
        gap: 16px;
      }
      .side-column {
        display: grid;
        gap: 16px;
        align-content: start;
      }
    }
  </style>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <div class="layout">
    <div class="main-column">
      <div class="card topbar">
        <h1 style="margin:0;">掲示板</h1>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="pill">Live更新: 5秒</span>
          <button id="theme-toggle" class="theme-toggle" type="button">🌙 ダーク</button>
        </div>
      </div>

      <div class="card">
        <div class="meta-grid">
          <span class="pill" id="total-posts">投稿数: 0</span>
          <span class="pill" id="active-users">参加者: 0</span>
          <span class="pill" id="latest-post-time">最新投稿: --</span>
          <span class="pill" id="active-filter">フィルター: なし</span>
        </div>
      </div>

  <div id="background-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h2>背景を選択</h2>
      <div id="bg-options" style="display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center;"></div>
    </div>
  </div>

      <div class="card">
  <form id="postForm" action="https://script.google.com/macros/s/AKfycbxdCarkggYZJvshEx07ItNVIV2B3zQ4N910AIjWsUyQ_IGCmo51Gceq_uqimJS1C365eA/exec" method="POST">
    <label for="username">ユーザー名:</label>
    <input type="text" id="username" name="username" placeholder="ユーザー名" required>
    <br><br>
    <label for="content">投稿内容:</label>
    <textarea id="content" name="content" placeholder="内容" required></textarea>
    <br><br>
    <div class="g-recaptcha" data-sitekey="6LcEOwIrAAAAAKc6hl6J6doCeY4Nq4qWAEP-Xloh"></div>
    <br>
    <button type="submit">投稿</button>
  </form>
      </div>
      <div class="card">
        <ul id="posts"></ul>
        <div style="text-align:center; margin-top:12px;">
          <button id="load-more" type="button" style="display:none;">さらに50件読み込む</button>
        </div>
      </div>
    </div>

    <aside class="side-column">
      <section class="card sidebar-section">
        <h3>ストーリー風ユーザー</h3>
        <div id="story-users" class="chip-list"></div>
      </section>
      <section class="card sidebar-section">
        <h3>トレンド</h3>
        <div id="trends" class="chip-list"></div>
      </section>
      <section class="card sidebar-section">
        <h3>コミュニティ</h3>
        <div id="community-tags" class="chip-list"></div>
      </section>
    </aside>
  </div>

  <button class="settings-button" id="open-settings">
    <img src="Setup.png" alt="設定">
  </button>

  <script>
    let activeFilter = null;
    let visibleCount = 50;
    let currentFilteredPosts = [];

    async function fetchPostsFromNumberApi(startNumber, maxTries = 600) {
      const extraPosts = [];
      let missCount = 0;

      for (let number = startNumber; number < startNumber + maxTries; number++) {
        try {
          const response = await fetch(`https://api.gamma.f5.si/post/${number}`);
          if (!response.ok) {
            missCount++;
            if (missCount >= 10) break;
            continue;
          }

          const data = await response.json();
          const username = data.username || data.user || data.name;
          const content = data.content || data.text || data.body;
          const date = data.date || data.createdAt || data.timestamp;

          if (username && content && date) {
            extraPosts.push([date, username, content]);
            missCount = 0;
          } else {
            missCount++;
            if (missCount >= 10) break;
          }
        } catch (_error) {
          break;
        }
      }

      return extraPosts;
    }

    function normalizeWords(text) {
      return text
        .replace(/https?:\/\/\S+/g, "")
        .replace(/[!-/:-@[-`{-~]/g, " ")
        .split(/\s+/)
        .filter(word => word.length >= 3);
    }

    function updateInsights(posts) {
      const users = new Set();
      const words = {};
      const hashtags = {};

      posts.forEach(post => {
        const username = post[1];
        const content = String(post[2] || "");
        if (username) users.add(username);

        normalizeWords(content.toLowerCase()).forEach(word => {
          words[word] = (words[word] || 0) + 1;
        });

        const matchedTags = content.match(/#([\wぁ-んァ-ン一-龯ー]+)/g) || [];
        matchedTags.forEach(tag => {
          hashtags[tag] = (hashtags[tag] || 0) + 1;
        });
      });

      const latest = posts[posts.length - 1];
      const latestDate = latest ? new Date(latest[0]) : null;
      document.getElementById('total-posts').textContent = `投稿数: ${posts.length}`;
      document.getElementById('active-users').textContent = `参加者: ${users.size}`;
      document.getElementById('latest-post-time').textContent = `最新投稿: ${latestDate && !isNaN(latestDate) ? latestDate.toLocaleString() : '--'}`;
      document.getElementById('active-filter').textContent = `フィルター: ${activeFilter || 'なし'}`;

      const storyUsers = document.getElementById('story-users');
      storyUsers.innerHTML = '';
      Array.from(users).slice(-8).forEach(user => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.type = 'button';
        chip.textContent = user;
        chip.addEventListener('click', () => {
          document.getElementById('username').value = user;
          document.getElementById('content').focus();
        });
        storyUsers.appendChild(chip);
      });

      const trends = document.getElementById('trends');
      trends.innerHTML = '';
      Object.entries(words)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .forEach(([word, count]) => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = `${word} (${count})`;
          trends.appendChild(chip);
        });

      const communityTags = document.getElementById('community-tags');
      communityTags.innerHTML = '';
      const clearChip = document.createElement('button');
      clearChip.className = 'chip';
      clearChip.type = 'button';
      clearChip.textContent = 'すべて表示';
      clearChip.addEventListener('click', () => {
        activeFilter = null;
        fetchPosts();
      });
      communityTags.appendChild(clearChip);

      Object.entries(hashtags)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .forEach(([tag, count]) => {
          const chip = document.createElement('button');
          chip.className = 'chip';
          chip.type = 'button';
          chip.textContent = `${tag} (${count})`;
          chip.addEventListener('click', () => {
            activeFilter = tag;
            fetchPosts();
          });
          communityTags.appendChild(chip);
        });
    }

    function applyActiveFilter(posts) {
      if (!activeFilter) return posts;
      return posts.filter(post => String(post[2] || '').includes(activeFilter));
    }

    function renderPosts(posts) {
      currentFilteredPosts = posts;
      updateInsights(posts);
      const postsDiv = document.getElementById("posts");
      const loadMoreButton = document.getElementById('load-more');
      postsDiv.innerHTML = '';

      const visiblePosts = posts.slice(-visibleCount);

      if (visiblePosts.length === 0) {
        postsDiv.innerHTML = `<p>まだ投稿がありません。</p>`;
        loadMoreButton.style.display = 'none';
        return;
      }

      visiblePosts.slice().reverse().forEach((post, index) => {
        if (post[1] && post[2] && post[0]) {
          const postElement = document.createElement("div");
          postElement.classList.add("post");
          const postNumberValue = posts.length - index;
          postElement.id = `post-${postNumberValue}`;

          const postNumber = `#${postNumberValue}`;
          const username = post[1];
          let content = post[2].replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const date = new Date(post[0]);
          const formattedDate = isNaN(date) ? "" : date.toLocaleString();
          const reportUrl = `https://docs.google.com/forms/d/e/1FAIpQLSe_gcI4CYjBM-ZGsIR5Q_nd0aquUixz7LixaqzfeuUjEowliQ/viewform?usp=pp_url&entry.1458296354=${encodeURIComponent(postNumber)}`;

          const replyPattern = /^&gt;&gt;&gt;#(\d+)/;
          if (replyPattern.test(content)) {
            content = content.replace(replyPattern, (match, p1) => {
              return `<a href="#post-${p1}" class="post-number-link">${match}</a>`;
            });
          }

          let adminIconHtml = '';
          if (username === "YU1000") {
            adminIconHtml = `<img src="kanri.png" alt="管理者" class="admin-icon">`;
          }

          postElement.innerHTML = `
            <p>
              <strong>${username}</strong>${adminIconHtml}: <span class="post-content">${content}</span>
              <br>
              <span class="post-date">${formattedDate}</span>
              <button class="reply-button" onclick="replyToPost('${postNumber}')">返信</button>
              <span class="post-number">${postNumber}</span>
              <button class="report-button" onclick="window.open('${reportUrl}', '_blank')">報告</button>
            </p>`;
          postsDiv.appendChild(postElement);
        }
      });

      loadMoreButton.style.display = posts.length > visibleCount ? 'inline-block' : 'none';
    }

    async function fetchPosts() {
      const postsDiv = document.getElementById("posts");
      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbxdCarkggYZJvshEx07ItNVIV2B3zQ4N910AIjWsUyQ_IGCmo51Gceq_uqimJS1C365eA/exec');
        const json = await response.json();
        const basePosts = Array.isArray(json) ? json.slice(1) : [];

        // まず既存データを即時描画（ここを遅らせない）
        renderPosts(applyActiveFilter(basePosts));

        // 200件制限の可能性があるときだけ、バックグラウンドで補完
        if (basePosts.length >= 200) {
          fetchPostsFromNumberApi(basePosts.length + 1).then(extraPosts => {
            if (!Array.isArray(extraPosts) || extraPosts.length === 0) return;

            const combined = basePosts.concat(extraPosts);
            // date+username+content の簡易重複排除
            const unique = [];
            const seen = new Set();
            combined.forEach(post => {
              const key = `${post[0]}__${post[1]}__${post[2]}`;
              if (!seen.has(key)) {
                seen.add(key);
                unique.push(post);
              }
            });
            renderPosts(applyActiveFilter(unique));
          }).catch(() => {
            // 補完失敗でも初回描画は維持
          });
        }
      } catch (_error) {
        postsDiv.innerHTML = `<p>投稿の取得に失敗しました。時間をおいて再読み込みしてください。</p>`;
      }
    }

    // ここから既存処理


    function replyToPost(postNumber) {
      const contentField = document.getElementById('content');
      contentField.value = `>>>${postNumber}\n`;
      contentField.focus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark') {
        document.body.classList.add('theme-dark');
        document.getElementById('theme-toggle').textContent = '☀️ ライト';
      }

      document.getElementById('theme-toggle').addEventListener('click', () => {
        document.body.classList.toggle('theme-dark');
        const dark = document.body.classList.contains('theme-dark');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        document.getElementById('theme-toggle').textContent = dark ? '☀️ ライト' : '🌙 ダーク';
      });

      document.getElementById('load-more').addEventListener('click', () => {
        visibleCount += 50;
        renderPosts(currentFilteredPosts);
      });

      fetchPosts();
      setInterval(fetchPosts, 5000);

      if (window.location.hash) {
        setTimeout(() => {
          const targetElement = document.querySelector(window.location.hash);
          if (targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth' });
          }
        }, 100);
      }
    });

    const ngWords = [
        "うんこ",
        "ウンコ",
        "ちんこ",
        "チンコ",
    ];

    function containsNgWord(text) {
        for (const word of ngWords) {
            if (text.toLowerCase().includes(word.toLowerCase())) {
                return true;
            }
        }
        return false;
    }

    document.getElementById('postForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const button = event.target.querySelector('button');
      button.disabled = true;

      const usernameField = document.getElementById('username');
      const contentField = document.getElementById('content');
      const username = usernameField.value;
      const content = contentField.value;
      const correctPassword = "YU10002025";

      if (containsNgWord(username) || containsNgWord(content)) {
          alert("不適切な言葉が含まれています。投稿できません。");
          button.disabled = false;
          return;
      }

      if (username === "YU1000") {
        let password = prompt("このユーザー名を使用するためにはパスワードが必要です。");
        if (password !== correctPassword) {
          alert("パスワードが違います。");
          button.disabled = false;
          return;
        }
      }

      const recaptchaResponse = grecaptcha.getResponse();
      if (!recaptchaResponse) {
        alert("reCAPTCHA認証が完了していません。");
        button.disabled = false;
        return;
      }

      const formData = new FormData(event.target);
      formData.append('g-recaptcha-response', recaptchaResponse);

      await fetch(event.target.action, {
        method: 'POST',
        body: formData
      });

      button.disabled = false;
      event.target.reset();
      grecaptcha.reset();
      fetchPosts();
    });

    const settingsButton = document.getElementById('open-settings');
    const modal = document.getElementById('background-modal');
    const closeModal = document.getElementById('close-modal');
    const bgOptionsDiv = document.getElementById('bg-options');

    const backgroundCandidates = [
      { label: "なし", file: "none" },
      { label: "端末から挿入", file: "upload" },
      { label: "背景1", file: "bg1.jpg" }
    ];

    settingsButton.addEventListener('click', () => {
      modal.style.display = 'block';
      bgOptionsDiv.innerHTML = '';

      backgroundCandidates.forEach(candidate => {
        let element;
        if (candidate.file === "none" || candidate.file === "upload") {
          element = document.createElement('div');
          element.textContent = candidate.label;
          element.className = 'bg-option none-option';
        } else {
          element = document.createElement('img');
          element.src = 'background/' + candidate.file;
          element.alt = candidate.label;
          element.className = 'bg-option';
        }
        element.addEventListener('click', () => {
          if (candidate.file === "none") {
            document.body.style.backgroundImage = "none";
            modal.style.display = 'none';
          } else if (candidate.file === "upload") {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);
            fileInput.addEventListener('change', function() {
              const file = fileInput.files[0];
              if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                  document.body.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
              }
              document.body.removeChild(fileInput);
            });
            fileInput.click();
            modal.style.display = 'none';
          } else {
            document.body.style.backgroundImage = `url('background/${candidate.file}')`;
            modal.style.display = 'none';
          }
        });
        bgOptionsDiv.appendChild(element);
      });
    });

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });
    window.addEventListener('click', (event) => {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    });
    window.addEventListener('load', () => {
      document.body.style.backgroundImage = "none";
    });
  </script>
</body>
</html>
